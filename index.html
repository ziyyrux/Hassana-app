<title>حسنة – صدقة جارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
 --green:#123C32;--emerald:#1B5143;--bg:#F7F6F0;--surface:#FFFFFF;--ink:#202B27;--mute:#78877E;--gold:#B49A63;--line:#E7E5D9;--hero-ink:#F1ECD9;
 --f-head:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,sans-serif;--f-quran:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1915;--surface:#16241F;--ink:#E7ECE4;--mute:#8FA096;--line:#233630;--green:#0C2A23;--emerald:#1B5143}}
:root[data-theme="dark"]{--bg:#0F1915;--surface:#16241F;--ink:#E7ECE4;--mute:#8FA096;--line:#233630;--green:#0C2A23;--emerald:#1B5143}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:600px;margin:auto;padding:8px 20px 24px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-head);font-weight:500;margin:0}
.eyebrow{font-size:13px;color:var(--mute);margin:0}
.title{font-size:22px;margin:2px 0 18px}
/* hero */
.hero{background:var(--green);color:var(--hero-ink);border-radius:24px;padding:22px 20px 20px;text-align:center;margin-bottom:28px}
.hero img{width:78%;max-width:320px;height:auto;display:block;margin:4px auto 14px}
.hero p{margin:0;font-size:14px;opacity:.75}
.hero .hijri{font-size:13px;color:var(--gold);opacity:1;margin-top:4px}
/* daily */
.label{font-size:13px;color:var(--gold);letter-spacing:.02em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.label::after{content:"";height:1px;background:var(--line);flex:1}
.daily{margin-bottom:30px}
.daily .q{font:400 25px/2.2 var(--f-quran);margin:0;text-align:center}
.daily .s{text-align:center;font-size:13px;color:var(--mute);margin:4px 0 0}
/* list */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:16px 2px;border-bottom:1px solid var(--line);text-align:start;transition:background .2s}
.row:active{background:color-mix(in srgb,var(--green) 6%,transparent)}
.row .t{flex:1}.row h3{font-size:17px}.row small{color:var(--mute);font-size:13px}
.row .ic{color:var(--mute);width:18px;height:18px}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:2.5}
.ring .a{stroke:var(--line)}.ring .b{stroke:var(--emerald);stroke-linecap:round;transition:stroke-dashoffset .5s ease;transform:rotate(90deg);transform-origin:center}
:root[data-theme="dark"] .ring .b{stroke:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ring .b{stroke:var(--gold)}}
/* topbar */
.top{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-inline-start:-8px}
.back:active{background:var(--line)}
.top h2{font-size:19px}
/* adhkar items */
.item{padding:24px 0;border-bottom:1px solid var(--line)}
.item .q{font:400 25px/2.25 var(--f-quran);margin:0;white-space:pre-line;text-align:center}
.item .src{text-align:center;font-size:13px;color:var(--mute);margin:2px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.acts{display:flex;gap:2px}
.act{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:background .2s,color .2s}
.act:active{background:var(--line)}
.act.on{color:var(--gold)}.act.on .ic{fill:var(--gold);animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.28)}}
.cnt{min-width:96px;height:42px;padding:0 20px;border-radius:21px;background:var(--green);color:var(--hero-ink);font:500 16px var(--f-head);transition:transform .12s,background .3s,opacity .3s}
:root[data-theme="dark"] .cnt{background:var(--emerald)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cnt{background:var(--emerald)}}
.cnt:active{transform:scale(.95)}
.cnt.done{background:transparent;color:var(--emerald);box-shadow:inset 0 0 0 1px var(--line);opacity:.9}
:root[data-theme="dark"] .cnt.done{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cnt.done{color:var(--gold)}}
.prog{height:2px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
/* tasbeeh */
.tas{display:grid;place-items:center;padding:10px 0 0}
.dial{position:relative;width:260px;height:260px;margin:12px 0 26px}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:3}
.dial .a{stroke:var(--line)}.dial .b{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s ease}
.tap{position:absolute;inset:14px;border-radius:50%;background:var(--green);color:var(--hero-ink);font:400 60px/1 var(--f-head);display:grid;place-items:center;transition:transform .12s;user-select:none;-webkit-user-select:none}
:root[data-theme="dark"] .tap{background:var(--emerald)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tap{background:var(--emerald)}}
.tap:active{transform:scale(.97)}
.ghost{color:var(--mute);font-size:14px;padding:6px 16px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.quote{font:400 22px/2.1 var(--f-quran);text-align:center;margin:26px 0 0;color:var(--ink)}
/* names */
.field{display:flex;gap:8px;margin-bottom:6px}
.field input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-size:16px;outline:none}
.field input:focus{border-color:var(--emerald)}
.field button{height:48px;padding:0 20px;border-radius:14px;background:var(--green);color:var(--hero-ink);font-family:var(--f-head);font-size:15px}
.nm{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);font-size:18px}
.nm button{color:var(--mute);width:36px;height:36px;border-radius:50%;font-size:18px}
.empty{color:var(--mute);text-align:center;padding:42px 10px;font-size:15px}
/* nav */
.tabbar{position:fixed;inset:auto 0 0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(10px)}
.tabbar div{max-width:600px;margin:auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;font-size:12px;color:var(--mute);transition:color .25s;position:relative}
.tabbar button.on{color:var(--emerald)}
:root[data-theme="dark"] .tabbar button.on{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar button.on{color:var(--gold)}}
.tabbar button.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--green);color:var(--hero-ink);padding:8px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute);font-size:14px;transition:.2s}
.chip.on{background:var(--green);color:var(--hero-ink);box-shadow:none}
.feat{display:block;background:var(--green);color:var(--hero-ink);border-radius:20px;padding:18px 20px;margin-bottom:22px}
.feat h2{font-size:20px;margin:2px 0 14px}.feat .k{margin:0;font-size:13px;color:#C9B27C}
.r2{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-top:10px}
.pb{height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.pb i{display:block;height:100%;background:var(--gold);transition:width .4s ease}
.feat .ok{margin:14px 0 0;font-size:15px;text-align:center}
.ghost.light{color:var(--hero-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);margin-top:14px}
.stats{display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--mute);margin-bottom:26px;line-height:1.5}
.stats .ring{margin-bottom:4px}
.log{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
.log i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.log .l1{background:color-mix(in srgb,var(--gold) 35%,var(--line))}.log .l2{background:color-mix(in srgb,var(--gold) 70%,var(--line))}.log .l3{background:var(--gold)}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font:inherit;font-size:16px;outline:none;margin-bottom:22px}
.search:focus{border-color:var(--emerald)}
.note{font-size:14px;color:var(--mute);text-align:center;margin:6px 0 0;white-space:pre-line}
.item .src{line-height:1.6}
.by{text-align:center;font:400 12px var(--f-head);letter-spacing:.04em;color:var(--mute);opacity:.7;margin:30px 0 0;direction:ltr}
</style>

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function chk(){if(ls.get("day")!==today()){ls.set("day",today());for(const k in cnt)delete cnt[k];ls.set("cnt",cnt)}}
function auto(){const h=new Date().getHours();return h>=21||h<3?"sleep":h<6?"wake":h<15?"morning":"evening"}
function pct(g){const L=CM[g].ids.filter(id=>I[id][2]>0);return[L.filter(id=>(cnt[g+":"+id]||0)>=I[id][2]).length,L.length]}
function logDay(){const o={};["morning","evening","sleep"].forEach(g=>{const[d,t]=pct(g);o[g]=t?Math.round(d/t*100):0});const L=ls.get("log",{});L[today()]=o;const ks=Object.keys(L).sort();while(ks.length>180)delete L[ks.shift()];ls.set("log",L)}
let V={s:"home",c:"morning",g:auto()};
const TABS=[["home","الرئيسية"],["daily","أذكاري"],["tas","المسبحة"],["fav","المفضلة"]];
function go(s,c){V.s=s;if(c)V.c=c;draw();scrollTo(0,0)}
function sg(g){V.g=g;draw()}
function tabs(){const a=V.s=="cat"?"home":V.s;$("#tabs").innerHTML=TABS.map(([k,t])=>`<button class="${k==a?'on':''}" onclick="go('${k}')">${ic(k)}<span>${t}</span></button>`).join("")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
function hijri(){try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){return ""}}
function ring(d,t){const c=2*Math.PI*14,o=c*(1-(t?d/t:0));return `<svg class="ring" viewBox="0 0 34 34"><circle class="a" cx="17" cy="17" r="14"/><circle class="b" cx="17" cy="17" r="14" stroke-dasharray="${c}" stroke-dashoffset="${o}" style="transform:rotate(-90deg);transform-origin:center"/></svg>`}
function lab(k,id){const n=I[id][2],c=cnt[k]||0;return n==1?(c?"تمّ ✓":"أتممت"):n>1?(c>=n?"تمّ":ar(c)+" / "+ar(n)):(c?ar(c):"سبّح")}
const isd=(k,id)=>I[id][2]>0&&(cnt[k]||0)>=I[id][2];
const wd=(k,id)=>{const n=I[id][2];return n>0?Math.min(100,(cnt[k]||0)/n*100):0};
function card(k,id){const d=I[id],f=fav.includes(id),s=TAG[d[3]]+(d[1]?" · "+d[1]:"");
 return `<article class="item" id="i-${k}"><p class="q">${esc(d[0])}</p><p class="src">${esc(s)}</p>${d[4]?`<p class="note">${esc(d[4])}</p>`:""}
 <div class="bar"><div class="acts"><button class="act ${f?'on':''}" aria-label="المفضلة" onclick="tf('${id}',this)">${ic("fav")}</button><button class="act" aria-label="نسخ" onclick="cp('${id}')">${ic("copy")}</button>${d[2]!=1?`<button class="act" aria-label="تصفير" onclick="rs('${k}','${id}')">${ic("reset")}</button>`:""}</div>
 <button class="cnt ${isd(k,id)?'done':''}" onclick="hit('${k}','${id}')">${lab(k,id)}</button></div>${d[2]>0?`<div class="prog"><i style="width:${wd(k,id)}%"></i></div>`:""}</article>`}
const cards=(ctx,ids)=>ids.map(id=>card(ctx+":"+id,id)).join("");
const tbar=t=>`<div class="top"><button class="back" aria-label="رجوع" onclick="go('home')">${ic("back")}</button><h2>${t}</h2></div>`;
function dhead(){const g=V.g,[d,t]=pct(g),p=t?d/t*100:0;

 <div class="feat"><div class="r2"><span>${ar(d)} من ${ar(t)} مكتمل</span><span>المتبقي ${ar(t-d)}</span></div><div class="pb"><i style="width:${p}%"></i></div>${t&&d==t?`<p class="ok">تقبّل الله منك. أتممت ${CM[g].n} لهذا اليوم.</p>`:""}<button class="ghost light" onclick="restart()">ابدأ أذكاري</button></div>`}

 <button class="feat" onclick="go('daily')" style="width:100%;text-align:start"><p class="k">أذكاري اليوم</p><h2>${CM[g].n}</h2><div class="pb"><i style="width:${t?d/t*100:0}%"></i></div><div class="r2"><span>${ar(d)} من ${ar(t)} مكتمل</span><span>المتبقي ${ar(t-d)}</span></div></button>

 <div id="hb"><section class="daily"><p class="label">دعاء اليوم</p><p class="q">${esc(I[pk][0])}</p><p class="s">${esc(I[pk][1])}</p></section>
 <p class="label">المكتبة</p><div class="list">${C.map(c=>`<button class="row" onclick="go('cat','${c.id}')"><span class="t"><h3>${c.n}</h3><small>${ar(c.ids.length)} نصًا</small></span>${ic("chev")}</button>`).join("")}</div></div><p class="by">By ziad</p>`}
function draw(){chk();tabs();let h="";
 if(V.s=="home")h=home();
 else if(V.s=="daily")h=`<p class="eyebrow">الآن وقت ${CM[auto()].n}</p><h1 class="title">أذكاري اليوم</h1><div id="dh">${dhead()}</div>${cards(V.g,CM[V.g].ids)}`;
 else if(V.s=="cat"){const c=CM[V.c];h=tbar(c.n)+(c.d?`<p class="note" style="margin:-6px 0 4px">${c.d}</p>`:"")+cards(c.id,c.ids)}
 else if(V.s=="tas"){const n=ls.get("tas",0),c=2*Math.PI*122,o=c*(1-(n%33)/33);
  h=`<p class="eyebrow">سبّح</p><h1 class="title">المسبحة</h1><div class="tas"><div class="dial"><svg viewBox="0 0 260 260"><circle class="a" cx="130" cy="130" r="122"/><circle class="b" id="rg" cx="130" cy="130" r="122" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><button class="tap" id="b" aria-label="تسبيح" onclick="tap()">${ar(n)}</button></div><button class="ghost" onclick="ls.set('tas',0);draw()">تصفير</button></div>`}
 else if(V.s=="fav"){fav=fav.filter(id=>I[id]);h=`<p class="eyebrow">محفوظاتك</p><h1 class="title">المفضلة</h1>`+(fav.length?cards("lib",fav):'<p class="empty">اضغط على القلب في أي ذكر لتجده هنا</p>')}

 $("#app").innerHTML=`<main>${h}</main>`}
function sq(v){const q=nz(v.trim());$("#hb").hidden=!!q;let r="";if(q){const m=Object.keys(I).filter(id=>nz(I[id][0]+" "+I[id][1]+" "+(I[id][4]||"")).includes(q));r=m.length?cards("lib",m):'<p class="empty">لا نتائج</p>'}$("#res").innerHTML=r}
function upd(k,id){const e=G("i-"+k);if(!e)return;const b=e.querySelector(".cnt");b.textContent=lab(k,id);b.classList.toggle("done",isd(k,id));const p=e.querySelector(".prog i");if(p)p.style.width=wd(k,id)+"%"}
function after(){logDay();if(V.s=="daily")$("#dh").innerHTML=dhead()}
function hit(k,id){const n=I[id][2],c=cnt[k]||0,g=V.g,w=V.s=="daily"?pct(g):null;
 if(n==1)cnt[k]=c?0:1;else if(n>1){if(c>=n)return;cnt[k]=c+1}else cnt[k]=c+1;
 ls.set("cnt",cnt);vib(isd(k,id)?[20,40,20]:12);upd(k,id);after();
 if(w&&w[0]<w[1]){const z=pct(g);if(z[0]==z[1])toast("تقبّل الله منك")}}
function rs(k,id){cnt[k]=0;ls.set("cnt",cnt);upd(k,id);after()}
function restart(){CM[V.g].ids.forEach(id=>delete cnt[V.g+":"+id]);ls.set("cnt",cnt);logDay();draw()}
function tf(id,b){const i=fav.indexOf(id);i<0?fav.push(id):fav.splice(i,1);ls.set("fav",fav);if(V.s=="fav"){draw();return}b.classList.remove("on");void b.offsetWidth;b.classList.toggle("on",i<0)}
function cp(id){const d=I[id],t=d[0]+(d[1]?"\n("+d[1]+")":"");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("تم النسخ"),()=>toast("تعذّر النسخ"))}
function tap(){const n=ls.get("tas",0)+1;ls.set("tas",n);vib(n%33==0?[25,40,25]:10);$("#b").textContent=ar(n);const c=2*Math.PI*122;$("#rg").style.strokeDashoffset=c*(1-(n%33)/33)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ls.get("day")!==today()){V.g=auto();draw()}});
draw();
</script>
