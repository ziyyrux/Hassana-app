<title>حسنة – صدقة جارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
/* ── tokens ── */
:root{
 --green:#123C32;--emerald:#1B5143;--bg:#F7F6F0;--surface:#FFFFFF;--ink:#202B27;--mute:#78877E;--gold:#B49A63;--gold-ink:#B49A63;--line:#E7E5D9;--hero-ink:#F1ECD9;
 --btn:var(--green);--accent:var(--emerald);
 --r-s:12px;--r-m:16px;--r-l:20px;--pad:20px;--tab:74px;
 --f-head:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,sans-serif;--f-quran:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;
 color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1915;--surface:#16241F;--ink:#E7ECE4;--mute:#8FA096;--line:#233630;--green:#0C2A23;--emerald:#1B5143;--btn:var(--emerald);--accent:var(--gold);--gold-ink:var(--gold)}}
:root[data-theme="dark"]{--bg:#0F1915;--surface:#16241F;--ink:#E7ECE4;--mute:#8FA096;--line:#233630;--green:#0C2A23;--emerald:#1B5143;--btn:var(--emerald);--accent:var(--gold);--gold-ink:var(--gold);color-scheme:dark}
@media (max-width:360px){:root{--pad:16px}}
/* ── base ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-body);padding-bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.feat :focus-visible,.swc :focus-visible{outline-color:var(--gold)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:600px;margin:auto;padding:8px var(--pad) 24px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-head);font-weight:500;margin:0;line-height:1.4}
.eyebrow{font-size:13px;color:var(--mute);margin:0}
.title{font-size:24px;margin:2px 0 20px}
.label{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:13px;color:var(--gold-ink)}
.label::after{content:"";height:1px;flex:1;background:var(--line)}
.note{margin:8px 0 0;font-size:14px;color:var(--mute);text-align:center;white-space:pre-line}
.empty{padding:44px 12px;text-align:center;font-size:15px;color:var(--mute)}
.by{margin:32px 0 0;text-align:center;direction:ltr;font:400 12px var(--f-head);letter-spacing:.04em;color:var(--mute);opacity:.7}
/* ── home ── */
.hero{background:var(--green);color:var(--hero-ink);border-radius:var(--r-l);padding:22px 20px 20px;text-align:center;margin-bottom:24px}
.hero img{width:78%;max-width:320px;height:auto;display:block;margin:4px auto 14px}
.hero p{margin:0;font-size:14px;opacity:.8}
.hero .hijri{font-size:13px;color:var(--gold);opacity:1;margin-top:4px}
.inst{display:block;width:100%;margin-bottom:20px;padding:12px 20px;text-align:center;border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line);color:var(--accent);font:500 15px var(--f-head)}
.inst:active{background:var(--line)}
.feat{display:block;background:var(--green);color:var(--hero-ink);border-radius:var(--r-l);padding:18px 20px;margin-bottom:24px;transition:transform .12s}
button.feat:active{transform:scale(.99)}
.feat .k{margin:0;font-size:13px;color:var(--gold)}
.feat h2{font-size:20px;margin:2px 0 14px}
.feat .ok{margin:14px 0 0;font-size:15px;text-align:center}
.meta{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.pb{height:3px;border-radius:3px;background:rgba(241,236,217,.18);overflow:hidden}
.pb i{display:block;height:100%;background:var(--gold);transition:width .4s ease}
.meta+.pb,.pb+.meta{margin-top:10px}
.stats{display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--mute);margin-bottom:28px;line-height:1.5}
.ring{width:36px;height:36px;flex:none;margin-bottom:4px}
.ring circle{fill:none;stroke-width:2.5}
.ring .a{stroke:var(--line)}
.ring .b{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.log{display:grid;grid-template-columns:repeat(13,minmax(0,1fr)) 1.8fr;gap:2px;margin:2px 0 8px}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:46px;padding:4px 0;border-radius:12px;font:400 11px/1.2 var(--f-body);color:var(--mute);touch-action:manipulation;transition:background .2s,transform .12s}
.ld:active{background:var(--line);transform:scale(.94)}
.ld.t{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--ink);font-weight:500}
.log i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.log .l1{background:color-mix(in srgb,var(--gold) 35%,var(--line))}
.log .l2{background:color-mix(in srgb,var(--gold) 70%,var(--line))}
.log .l3{background:var(--gold)}
.log .t i{box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 14%,var(--bg)),0 0 0 3.5px var(--gold)}
/* ── نافذة تفاصيل اليوم ── */
.dpc{width:min(420px,100%);max-height:min(82dvh,660px);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);color:var(--ink);border-radius:var(--r-l);box-shadow:inset 0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.3);animation:rise .4s ease both}
.dph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:16px 20px 8px 8px}
.dph h2{font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dph p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.dtag{font:500 11px var(--f-body);padding:1px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.dbody{overflow-y:auto;overscroll-behavior:contain;padding:0 20px 20px}
.dsum{margin:0 0 6px;font-size:14px;color:var(--mute)}
.ds{border-top:1px solid var(--line);padding:12px 0 6px}
.ds summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.ds summary::-webkit-details-marker{display:none}
.ds summary .dn{flex:1;font:500 16px var(--f-head)}
.ds summary .dc{font-size:13px;color:var(--mute)}
.ds summary .ic{width:16px;height:16px;color:var(--mute);transition:transform .2s}
.ds[open] summary .ic{transform:rotate(-90deg)}
.dst{font-size:12px;padding:1px 10px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.dst.s2{background:color-mix(in srgb,var(--gold) 22%,transparent);box-shadow:none}
.dst.s0{color:var(--mute)}
.dbar{height:3px;margin:10px 0 4px;border-radius:2px;background:var(--line);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--gold)}
.ds ul{list-style:none;margin:0;padding:0}
.ds li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;line-height:1.7;color:var(--mute)}
.ds li.ok{color:var(--ink)}
.ds li .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds li .tx.qr{font-family:var(--f-quran);font-size:16px}
.ds li small{font-size:12px;flex:none}
.mk{display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
.ds li.ok .mk{background:var(--gold);box-shadow:none;color:#123C32}
.mk .ic{width:12px;height:12px;stroke-width:2.4}
.search{width:100%;height:48px;margin-bottom:24px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.daily{margin-bottom:32px}

.chip{flex:none;height:40px;padding:0 18px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--mute);transition:background .2s,color .2s}

.item{padding:28px 0 24px;border-bottom:1px solid var(--line)}

@keyframes pop{40%{transform:scale(1.25)}}

.tas{display:grid;place-items:center;padding-top:8px}

.tap small{font-size:13px;line-height:1.6;opacity:.7}

.tr{display:flex;gap:10px;justify-content:center}
/* ── qibla ── */
.qb{display:grid;place-items:center;text-align:center}
.qs{display:block;width:min(320px,86vw);height:auto;margin:14px 0 6px;overflow:visible}

.qs .tg{fill:var(--gold)}

#nd{transform-origin:150px 150px;will-change:transform}

.qt span{font-size:14px;color:var(--mute)}
/* ── chrome ── */
.tabbar{position:fixed;inset:auto 0 0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar div{max-width:600px;margin:auto;display:flex}
.tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;font-size:12px;color:var(--mute);transition:color .25s}

.sw{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(10,28,23,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:opacity .35s ease,visibility .35s}

/* الميل الشمسي ومعادلة الزمن (خوارزمية NOAA / Meeus) */
function sunPos(ms){const T=(ms/864e5+2440587.5-2451545)/36525,
 L0=280.46646+T*(36000.76983+T*3.032e-4),M=(357.52911+T*(35999.05029-1.537e-4*T))*RAD,e=.016708634-T*(4.2037e-5+1.267e-7*T),
 C=Math.sin(M)*(1.914602-T*(.004817+1.4e-5*T))+Math.sin(2*M)*(.019993-1.01e-4*T)+Math.sin(3*M)*2.89e-4,
 om=(125.04-1934.136*T)*RAD,lam=(L0+C-.00569-.00478*Math.sin(om))*RAD,
 ep=(23+(26+(21.448-T*(46.815+T*(5.9e-4-T*1.813e-3)))/60)/60+.00256*Math.cos(om))*RAD,
 y=Math.tan(ep/2)**2,L=L0*RAD;
 return{d:Math.asin(Math.sin(ep)*Math.sin(lam)),q:4*DEG*(y*Math.sin(2*L)-2*e*Math.sin(M)+4*e*y*Math.sin(M)*Math.cos(2*L)-.5*y*y*Math.sin(4*L)-1.25*e*e*Math.sin(2*M))}}
function pmCalc(lat,lng,date,m,ram){
 const base=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()),phi=lat*RAD,
 noon=t=>base+(720-4*lng-sunPos(t).q)*6e4;
 let dh=base+(720-4*lng)*6e4;dh=noon(dh);dh=noon(dh);
 const ev=(alt,dir)=>{let t=dh;for(let k=0;k<4;k++){const p=sunPos(t),a=(typeof alt=="function"?alt(p):alt)*RAD,
  c=(Math.sin(a)-Math.sin(phi)*Math.sin(p.d))/(Math.cos(phi)*Math.cos(p.d));if(c<-1||c>1)return NaN;
  t=noon(t)+dir*Math.acos(c)*DEG/15*36e5}return t};
 const sr=ev(-.833,-1),mg=ev(-.833,1),asr=ev(p=>Math.atan(1/(1+Math.tan(Math.abs(phi-p.d))))*DEG,1);
 let fj=ev(-m.f,-1),is=m.m?mg+(ram?120:m.m)*6e4:ev(-m.i,1);
 if(isNaN(sr)||isNaN(mg))return null;
 const night=sr+864e5-mg;  /* خطوط العرض العالية: سُبع الليل عند غياب الشفق */
 if(isNaN(fj))fj=sr-night/7;if(isNaN(is))is=mg+night/7;
 const r=x=>Math.round(x/6e4)*6e4;
 return{fajr:r(fj),sunrise:r(sr),dhuhr:r(dh+m.d*6e4),asr:r(asr),maghrib:r(mg),isha:r(is)}}
/* ── مواقيت الصلاة: الواجهة ── */
const PN=[["fajr","الفجر"],["sunrise","الشروق"],["dhuhr","الظهر"],["asr","العصر"],["maghrib","المغرب"],["isha","العشاء"]];
let ptT=null,ptBusy=false,ptErr="",ptC={},ptNx=0,ptDk="";
const p2=n=>ar(Math.floor(n/10))+ar(n%10);
const hm=ms=>{const d=new Date(ms);return p2(d.getHours())+":"+p2(d.getMinutes())};
const hms=s=>p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60);
const dgr=(v,a,b)=>ar(+Math.abs(v).toFixed(2))+"° "+(v>=0?a:b);
function ptDay(d){const l=ls.get("loc",null);if(!l)return null;const k=pmKey(),id=d.toDateString()+"|"+l+"|"+k;
 if(!(id in ptC)){if(Object.keys(ptC).length>5)ptC={};ptC[id]=pmCalc(l[0],l[1],d,PM[k],k=="uq"&&isRam(d))}return ptC[id]}
function ptNext(){const n=new Date(),t=ptDay(n);if(!t)return null;
 for(const[k]of PN){if(k!="sunrise"&&t[k]>n.getTime())return{k,at:t[k],t}}
 const m=ptDay(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));return m?{k:"fajr",at:m.fajr,t}:null}
function ptRender(){const e=G("pt");if(!e)return;const l=ls.get("loc",null),er=ptErr?`<p class="note er">${ptErr}</p>`:"";
 if(!l){e.innerHTML=`<div class="pw"><p>لعرض مواقيت الصلاة بدقة حسب مدينتك، اسمح للتطبيق بتحديد موقعك. يُستخدم الموقع لحساب المواقيت على جهازك فقط.</p>${er}<button class="ghost" onclick="ptLocate()"${ptBusy?" disabled":""}>${ptBusy?"جارٍ تحديد الموقع…":"تحديد موقعي"}</button></div>`;return}
 const nx=ptNext();
 if(!nx){e.innerHTML=`<p class="empty">لا تتوفر مواقيت دقيقة لهذا الموقع في هذا التاريخ.</p>`+er;return}
 const n=new Date(),now=n.getTime(),t=nx.t,cur=ls.get("pm","auto"),au=pmAuto();ptNx=nx.at;ptDk=n.toDateString();
 e.innerHTML=`<div class="pn"><div><p class="k">الصلاة القادمة</p><h3>${PN.find(x=>x[0]==nx.k)[1]}</h3><p class="at">${new Date(nx.at).toDateString()!==ptDk?"غدًا ":""}عند ${hm(nx.at)}</p></div><div class="cd"><b id="pcd">${hms(Math.max(0,Math.ceil((nx.at-now)/1e3)))}</b><small>متبقي</small></div></div>
 <div class="pl">${PN.map(([k,nm])=>`<div class="pr${t[k]===nx.at&&k==nx.k?" nx":t[k]<=now?" ps":""}${k=="sunrise"?" sr":""}"><span>${nm}</span><b>${hm(t[k])}</b></div>`).join("")}</div>
 <p class="note">${new Intl.DateTimeFormat("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long"}).format(n)}</p>
 <div class="pf"><label for="pm">طريقة الحساب</label><select class="sel" id="pm" onchange="pmSet(this.value)"><option value="auto"${PM[cur]?"":" selected"}>تلقائي – ${esc(PM[au].n)}</option>${Object.keys(PM).map(k=>`<option value="${k}"${k==cur?" selected":""}>${esc(PM[k].n)}</option>`).join("")}</select></div>
 <p class="note" style="margin-top:14px">الموقع: ${dgr(l[0],"شمالًا","جنوبًا")}، ${dgr(l[1],"شرقًا","غربًا")}</p>${er}
 <button class="ghost" onclick="ptLocate()"${ptBusy?" disabled":""}>${ptBusy?"جارٍ تحديد الموقع…":"تحديث الموقع"}</button>`}
function pmSet(v){ls.set("pm",v);ptC={};ptRender()}
function ptLocate(sil){
 if(!navigator.geolocation){ptErr="الموقع غير مدعوم في هذا المتصفح.";ptRender();return}
 if(!sil){ptBusy=true;ptErr="";ptRender()}
 navigator.geolocation.getCurrentPosition(x=>{
  const o=ls.get("loc",null),c=[x.coords.latitude,x.coords.longitude],ch=!o||Math.abs(o[0]-c[0])>.005||Math.abs(o[1]-c[1])>.005;
  ls.set("loc",c);ls.set("locT",Date.now());ptBusy=false;ptErr="";if(ch||!sil)ptRender()},
 e=>{ptBusy=false;if(!sil)ptErr=e&&e.code===1?"لم يُسمح بالوصول إلى الموقع. فعّل إذن الموقع لهذا التطبيق من إعدادات المتصفح ثم أعد المحاولة.":"تعذّر تحديد الموقع. تأكد من تفعيل خدمة الموقع (GPS) ثم حاول مجددًا.";ptRender()},
 {timeout:15000,maximumAge:sil?36e5:0})}
/* تحديث الموقع تلقائيًا عند فتح التطبيق إن كان الإذن ممنوحًا مسبقًا */
function ptAuto(){if(!navigator.geolocation||!navigator.permissions||!navigator.permissions.query)return;
 if(ls.get("loc",null)&&Date.now()-ls.get("locT",0)<36e5)return;
 navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted")ptLocate(true)},()=>{})}
function ptTick(){const e=G("pcd");if(!e)return;
 if(Date.now()>=ptNx||ptDk!==new Date().toDateString()){ptRender();return}
 e.textContent=hms(Math.ceil((ptNx-Date.now())/1e3))}
function ptStop(){clearInterval(ptT);ptT=null}
function ptStart(){ptStop();ptRender();ptT=setInterval(ptTick,1000);ptAuto()}

function setTheme(t){
 const d=document.documentElement;
 const run=()=>{d.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t=="dark"?"#0F1915":"#F7F6F0";
  const b=G("thb");if(b){b.innerHTML=ic(t=="dark"?"sun":"moon");b.firstElementChild.classList.add("spin")}};
 ls.set("theme",t);vib(10);
 if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.startViewTransition(run);else run()}
function toggleTheme(){setTheme(document.documentElement.dataset.theme=="light"?"dark":"light")}
draw();
</script>

<script>
document.body.style.overflow="hidden";
function swClose(){const e=document.getElementById("sw");if(!e)return;e.classList.add("out");document.body.style.overflow="";try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}setTimeout(()=>e.remove(),400)}
</script>

<script>
/* تسجيل الـ Service Worker لتشغيل التطبيق بدون إنترنت */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}
</script>
