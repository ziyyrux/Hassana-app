name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Optional Vercel app URL (e.g. https://hassana-sandy.vercel.app) for Zad AI inside the APK"
        required: false
        default: "https://hassana-sandy.vercel.app"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HASSANA_API_ORIGIN: ${{ github.event.inputs.api_origin || vars.HASSANA_API_ORIGIN || 'https://hassana-sandy.vercel.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Install dependencies & build static web bundle
        run: |
          npm install
          node scripts/build-apk.js --prepare-dist

      - name: Install Capacitor Android tooling (build-time only)
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6

      - name: Generate and configure Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/build-apk.js --configure-android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Hassana-Android.apk

      - name: Upload Hassana-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: Hassana-Android-APK
          path: Hassana-Android.apk
          retention-days: 90

      - name: Publish Hassana-Android.apk to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest Hassana-Android.apk --clobber
            gh release edit apk-latest --latest --title "Hassana Android APK"
          else
            gh release create apk-latest Hassana-Android.apk --latest --title "Hassana Android APK" --notes "النسخة الأحدث من تطبيق حسنة للأندرويد (Hassana-Android.apk)."
          fi
