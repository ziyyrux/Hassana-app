name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Optional Vercel app URL (e.g. https://your-app.vercel.app) for Zad AI inside the APK"
        required: false
        default: ""

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      HASSANA_API_ORIGIN: ${{ github.event.inputs.api_origin || vars.HASSANA_API_ORIGIN || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build static web bundle
        run: |
          npm install
          node scripts/build-apk.js --prepare-dist

      - name: Install Capacitor Android tooling (build-time only)
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Generate and configure Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/build-apk.js --configure-android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Hassana-Android.apk

      - name: Upload Hassana-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: Hassana-Android-APK
          path: Hassana-Android.apk
          retention-days: 90
